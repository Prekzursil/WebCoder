# osv-scanner configuration for the lean dependency gate (pinned tool: osv-scanner 2.3.8).
# The CI gate runs `osv-scanner scan source --config=osv-scanner.toml --recursive .`
# (see .github/workflows/quality.yml -> reusable-quality.yml gate-deps step), which
# auto-discovers and scans the lockfiles in this repo (single-branch layout,
# 2026-10-27: the Next.js app lives at the repo root, Django under backend/,
# the Expo app under mobile/):
#   - package-lock.json        (root Next.js npm tree)
#   - mobile/package-lock.json (Expo mobile npm tree)
#   - backend deps via the root requirements.txt shim -> backend/deps.txt
#
# POLICY: ignore entries are allowed ONLY for a genuinely-unfixable vuln (no
# non-breaking upgrade) OR one that is provably not reachable in THIS product,
# each with a reason + dated review note (greppable). We do NOT use a baseline
# file — clean-zero is reached by upgrading where a safe fix exists, and only by
# a reasoned per-CVE ignore where it does not.
#
# 2026-06-17: no IgnoredVulns recorded at migration time. Add a dated, reasoned
# entry here only for a future vuln that is genuinely unfixable or provably
# unreachable in this product.
#
# 2026-06-20: dependency modernization pass. Bumped every fixable lockfile vuln
# to its patched version (backend/requirements.txt pins + frontend npm
# overrides), taking the tree from 188 known vulns to a single genuinely
# unfixable transitive entry, recorded below.
#
# 2026-07-25: dependency modernization pass #2. Took the tree from 25 known
# vulns (1 Critical) to 0 actionable, by bumping Django 5.2.15 -> 5.2.16 and
# adding/raising bounded-floor npm overrides (websocket-driver, fast-xml-parser,
# body-parser, brace-expansion, fast-uri, find-my-way, sharp, shell-quote, svgo,
# js-yaml, postcss, webpack-dev-server) plus react-router-dom 6.30.4 -> 7.18.x.
# One residual react-router advisory is genuinely unfixable on React 18 and is
# recorded below with a reachability argument.




[[IgnoredVulns]]
id = "GHSA-q849-wxrc-vqrp"
# hull.js "Code Injection Vulnerability" - arbitrary code execution via an
# unsafe `new Function(...)` in the module that handles the points FORMAT when
# the application passes hull()'s 3rd parameter unsanitised.
#
# NO FIX AVAILABLE: the advisory's fixed version is 1.0.10, but no release
# above 1.0.6 exists on npm (verified 2026-11-15 against
# https://registry.npmjs.org/hull.js - dist-tags.latest = 1.0.6 and the full
# version list ends at 1.0.6), so every publishable version sits inside the
# affected range (introduced 0.2.2). An override cannot reach a fixed release.
#
# NOT REACHABLE IN THIS PRODUCT: hull.js is pulled only by scratch-render
# (web Scratch stage), whose sole call site is
# node_modules/scratch-render/src/RenderWebGL.js:1954 - `hull(hullPoints,
# Infinity)` - TWO arguments; the vulnerable 3rd parameter (the points-format
# callback evaluated through new Function) is never passed anywhere in
# scratch-render. Verified 2026-11-15 by grepping scratch-render/src for
# `hull(`: exactly one call site, two arguments.
#
# Re-review when hull.js publishes > 1.0.6 (then pin via an npm override and
# delete this entry).
reason = "No fixed release exists on npm (latest 1.0.6 < advisory fixed 1.0.10, verified 2026-11-15); scratch-render passes only 2 args so the vulnerable 3rd-parameter path is unreachable. Reviewed 2026-11-15."


[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
# picomatch ReDoS (CVE-2026-112366) - catastrophic backtracking on a
# maliciously crafted pattern.
#
# NO FIX AVAILABLE: the advisory's fixed version is 4.0.8, but no release
# above 4.0.7 exists on npm (verified 2026-11-17 against
# https://registry.npmjs.org/picomatch - dist-tags.latest = 4.0.7 and the
# version list ends at 4.0.7), so an override cannot reach a fixed release.
#
# NOT REACHABLE IN THIS PRODUCT: picomatch enters both trees only as a
# transitive DEV-tooling dependency (micromatch -> fast-glob/glob inside
# vitest/jest/eslint toolchains); it is not part of the shipped Next.js
# runtime bundle or the Expo app bundle, and the ReDoS path requires an
# ATTACKER-CONTROLLED glob pattern while every pattern in the toolchain is
# developer-authored (test globs, lint config).
#
# Re-review when picomatch publishes >= 4.0.8 (then pin via an npm override
# and delete this entry).
reason = "No fixed release exists on npm (latest 4.0.7 < advisory fixed 4.0.8, verified 2026-11-17); dev-tooling-only transitive, not in shipped bundles, patterns are developer-authored. Reviewed 2026-11-17."
