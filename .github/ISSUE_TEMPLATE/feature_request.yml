name: Feature request
description: Propose a platform capability or a developer-experience improvement.
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem you are trying to solve
      description: What is blocked or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The shape you expect
      description: API, UI, or gate behavior. Sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
