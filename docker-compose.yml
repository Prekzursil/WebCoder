# WebCoder — local compose stack (public online-judge platform).
#
# Services:
#   postgres     - database
#   redis        - broker/cache (Celery worker containerisation is a
#                  follow-up; the worker currently defaults to the
#                  filesystem broker — see webcoder_api/celery.py)
#   backend      - Django API; judges submissions through judge-runner when
#                  JUDGE_BACKEND=container (see submissions/judge_utils/backend.py)
#   judge-runner - SANDBOXED judge container executing untrusted user code:
#                  network-isolated, read-only rootfs, all caps dropped,
#                  no-new-privileges, memory/CPU/PID limited
#
# Frontend (Next.js) is a placeholder comment at the bottom — see the
# migration note there.
#
# Usage:  docker compose up --build
# Override the dev defaults below via a root .env file or exported env vars.

name: webcoder

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webcoder_db}
      POSTGRES_USER: ${POSTGRES_USER:-webcoder_user}
      # DEV DEFAULT ONLY — set POSTGRES_PASSWORD in .env for anything exposed.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webcoder_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webcoder_user} -d ${POSTGRES_DB:-webcoder_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # No host port published by default: the dev machine already runs a local
    # PostgreSQL on 5433. Inspect with: docker compose exec postgres psql -U webcoder_user

  redis:
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: webcoder_api.settings
      # DEV DEFAULT ONLY — set SECRET_KEY in .env for anything exposed.
      SECRET_KEY: ${SECRET_KEY:-django-insecure-compose-dev-only-key}
      DB_NAME: ${POSTGRES_DB:-webcoder_db}
      DB_USER: ${POSTGRES_USER:-webcoder_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-webcoder_dev_password}
      DB_HOST: postgres
      DB_PORT: "5432"
      # Prod judge path: submissions run inside the sandboxed judge-runner
      # container via `docker exec` (submissions/judge_utils/backend.py).
      JUDGE_BACKEND: container
      # NOTE: not yet wired — webcoder_api/celery.py hardcodes the
      # filesystem broker after config_from_object, so setting
      # CELERY_BROKER_URL=redis://redis:6379/0 here would be a lie today.
      # Follow-up: honour CELERY_BROKER_URL in celery.py, then set it here
      # and add a dedicated celery-worker service.
    volumes:
      # Shared with judge-runner: the backend writes submission files here,
      # the judge-runner compiles/executes them at the same path.
      - judge-sandbox:/srv/judge
      # Docker socket: lets the backend `docker exec` into judge-runner.
      # SECURITY TRADEOFF: socket access is root-equivalent on the host.
      # Acceptable while backend+judge live on one compose host; for a
      # multi-node/hardened deployment replace with a socket proxy
      # (e.g. tecnativa/docker-socket-proxy) exposing only the exec API.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge-runner:
        condition: service_started
    restart: unless-stopped

  # ------------------------------------------------------------------
  # SANDBOXED JUDGE-RUNNER — executes untrusted user submissions.
  #
  # Hardening (consumed/asserted by backend/submissions/tests.py contract):
  #   network_mode: none  -> no network for the container AND for every
  #                          `docker exec` into it (exec joins the netns)
  #   read_only: true     -> immutable root filesystem; writable surfaces
  #                          are ONLY tmpfs /tmp and the /srv/judge volume
  #   cap_drop: ALL       -> no Linux capabilities
  #   security_opt        -> no-new-privileges (no setuid/sudo escape)
  #   mem/cpus/pids       -> resource ceiling bounding the blast radius
  #                          (per-submission limits are still enforced by
  #                          the caller's timeout + /usr/bin/time metrics)
  #   user 1000:1000      -> non-root, matches backend uid for the shared
  #                          judge-sandbox volume
  # ------------------------------------------------------------------
  judge-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile.judge
    # container_name is load-bearing: judge_utils/backend.py execs into this
    # exact name (JUDGE_RUNNER_CONTAINER = "webcoder-judge-runner").
    container_name: webcoder-judge-runner
    user: "1000:1000"
    command: ["sleep", "infinity"]
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: "1.5"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    volumes:
      - judge-sandbox:/srv/judge
    restart: unless-stopped
    # Deliberately NO healthcheck ports and NO published ports: nothing
    # should be able to reach this container over the network.

  # ------------------------------------------------------------------
  # Next.js frontend — PLACEHOLDER (Next 15 App Router migration, wave/
  # nextjs-migration). Uncomment once frontend/webcoder_ui is migrated from
  # CRA React-TS to Next; the SEO-facing problem catalog will be served
  # server-rendered from here.
  #
  # frontend:
  #   build:
  #     context: ./frontend/webcoder_ui
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:8000
  #   depends_on:
  #     - backend
  # ------------------------------------------------------------------

volumes:
  pgdata:
  redisdata:
  # Submission workspace shared between backend (writer) and judge-runner
  # (executor). NOT mounted into postgres/redis.
  judge-sandbox:
