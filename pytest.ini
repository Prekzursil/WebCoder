[pytest]
# The lean quality gate runs `python -m pytest` from the repository root, so the
# Django project under backend/ must be discoverable from here.
DJANGO_SETTINGS_MODULE = webcoder_api.settings_ci
pythonpath = backend
testpaths = backend
python_files = tests.py test_*.py *_tests.py
addopts = --nomigrations --cov=backend --cov-report=term-missing
filterwarnings =
    # [ONB-1 password-reset] dj-rest-auth 7.2.0 (allauth 65.x) consults the
    # deprecated allauth AUTHENTICATION_METHOD while composing password-reset
    # mails (dj_rest_auth/forms.py:81). Third-party at both pinned versions;
    # scoped to this exact message and raising module.
    ignore:app_settings.AUTHENTICATION_METHOD is deprecated:UserWarning:dj_rest_auth.forms
