# osv-scanner configuration for the lean dependency gate (pinned tool: osv-scanner 2.3.8).
# The CI gate runs `osv-scanner scan source --config=osv-scanner.toml --recursive .`
# (see .github/workflows/quality.yml -> reusable-quality.yml gate-deps step), which
# auto-discovers and scans the lockfiles in this repo:
#   - backend/requirements.txt              (Django backend pip deps)
#   - frontend/webcoder_ui/package-lock.json (React/CRA frontend npm tree)
#
# POLICY: ignore entries are allowed ONLY for a genuinely-unfixable vuln (no
# non-breaking upgrade) OR one that is provably not reachable in THIS product,
# each with a reason + dated review note (greppable). We do NOT use a baseline
# file — clean-zero is reached by upgrading where a safe fix exists, and only by
# a reasoned per-CVE ignore where it does not.
#
# 2026-06-17: no IgnoredVulns recorded at migration time. Add a dated, reasoned
# entry here only for a future vuln that is genuinely unfixable or provably
# unreachable in this product.
#
# 2026-06-20: dependency modernization pass. Bumped every fixable lockfile vuln
# to its patched version (backend/requirements.txt pins + frontend npm
# overrides), taking the tree from 188 known vulns to a single genuinely
# unfixable transitive entry, recorded below.
#
# 2026-07-25: dependency modernization pass #2. Took the tree from 25 known
# vulns (1 Critical) to 0 actionable, by bumping Django 5.2.15 -> 5.2.16 and
# adding/raising bounded-floor npm overrides (websocket-driver, fast-xml-parser,
# body-parser, brace-expansion, fast-uri, find-my-way, sharp, shell-quote, svgo,
# js-yaml, postcss, webpack-dev-server) plus react-router-dom 6.30.4 -> 7.18.x.
# One residual react-router advisory is genuinely unfixable on React 18 and is
# recorded below with a reachability argument.

[[IgnoredVulns]]
id = "GHSA-q849-wxrc-vqrp"
# hull.js "Code Injection" (critical). The advisory's fixed version is 1.0.10,
# which is NOT published: registry.npmjs.org/hull.js latest is 1.0.6 and the
# versions list ends at 1.0.6 (verified 2026-11-05). Overriding to the maximum
# published release (done: package.json pins hull.js 1.0.6) is therefore the
# minimum-vulnerability state. hull.js is a transitive dep of scratch-render,
# used only to convex-hull the paint-region of Scratch sprites (our own
# workspace geometry, never user-authored code).
# Re-review when hull.js publishes > 1.0.10, then drop the pin and this entry.
reason = "No fix published (advisory fixed=1.0.10; registry latest 1.0.6, verified 2026-11-05); pinned to 1.0.6; scratch-render sprite geometry only. Reviewed 2026-11-05."

[[IgnoredVulns]]
id = "GHSA-vh5w-fg69-rc8m"
# google-closure-library "Improper Input Validation" (moderate). The only fix
# is google-closure-library >= 20200315.0.0, and the sole consumer,
# scratch-blocks 1.3.0, pins ^20190301.0.0 with no release that bumps it
# (scratch-blocks 2.2.4 is a semver-major migration for this app - an owner
# decision, not a patch). The library ships inside scratch-blocks' compiled
# blocks editor; block XML is authored by our own blockly workspace, not raw
# user input.
# Re-review when scratch-blocks ships a closure-library >= 20200315 pin or the
# app migrates to scratch-blocks 2.x.
reason = "Fix requires scratch-blocks semver-major (2.2.4); 1.3.0 pins closure 20190301; block XML is workspace-authored, not raw user input. Reviewed 2026-11-05."

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
# deepmerge "prototype poisoning of returned objects" - advisory lists NO fixed
# version (osv fixed column is "--"). 4.3.1 is the latest published release
# (verified 2026-11-05). In this tree it sits under mobile's expo tooling
# (devDependency graph only, not shipped) and merges our own config objects.
# Re-review when deepmerge publishes a patched release.
reason = "No fixed version exists (advisory fixed=--; 4.3.1 is latest, verified 2026-11-05); dev-tooling graph only, merges repo-authored config. Reviewed 2026-11-05."
