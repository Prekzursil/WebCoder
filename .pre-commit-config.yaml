# Lean quality gates — local auto-fixers + fast checks (lean-gate charter, 2026-06-16).
# `pre-commit run --all-files` is the gate-1/gate-5 entrypoint used by CI (reusable-quality.yml).
# Every rev is pinned; bump versions here together with .quality/charter.yml.
#
# Languages present in this repo: Python (Django backend under backend/) + TS/JS
# (Next.js app at the repo root — single-branch layout since 2026-10-27).
minimum_pre_commit_version: "3.5.0"

default_language_version:
  python: python3

exclude: |-
  (?x)^(
    node_modules/|
    backend/venv/|
    dist/|
    build/|
    vendor/|
    \.venv/|
    .*\.egg-info/|
    \.next/|
    playwright-report/|
    test-results/|
    tree\.txt$
  )

repos:
  # --- Gate 1: Python lint + format (ruff 0.15.17) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        name: ruff (lint --fix)
        args: ["--fix"]
        files: '^backend/.*\.py$'
        exclude: '^backend/venv/'
      - id: ruff-format
        name: ruff (format)
        files: '^backend/.*\.py$'
        exclude: '^backend/venv/'

  # --- Gate 1: JS/TS lint (oxlint 1.69.0 mirror; single-branch: root src/ + e2e/) ---
  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.69.0
    hooks:
      - id: oxlint
        name: oxlint (frontend)
        args: ["--fix", "--deny-warnings"]
        files: '^(src|e2e)/.*\.(ts|tsx|js|jsx)$'

  # (Biome format hook removed 2026-10-27 — the unified root Next.js app is
  # eslint-formatted; biome.json belonged to the retired frontend/webcoder_ui
  # layout and no longer exists.)

  # --- Gate 5: secrets (gitleaks 8.30.1) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (secrets)
        args: ["--config", ".gitleaks.toml"]
