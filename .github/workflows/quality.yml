# Lean 6-gate quality caller (ADDITIVE — see the lean-gate charter, 2026-06-16).
#
# This thin caller delegates to the shared reusable lean-quality template. It does
# NOT replace the existing Quality Zero Platform workflows in this repo; those stay
# until the fleet-wide migration runbook removes the old SaaS machinery.
#
# Single-branch note (2026-10-27): the Next.js app moved from frontend/web to the
# repo root, so opengrep now scans backend/ + src/ + e2e/ instead of backend/ + frontend/.
name: quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    env:
      SECRET_KEY: ci-placeholder
      DB_PASSWORD: ci-placeholder
    uses: Prekzursil/quality-zero-platform/.github/workflows/reusable-quality.yml@v1
    with:
      opengrep-paths: "backend src e2e"
