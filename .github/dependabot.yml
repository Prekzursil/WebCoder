version: 2
updates:
# Single-branch (2026-10-27): pip deps moved from the retired backend branch
# onto main under backend/; the root npm manifest IS the frontend now.
#
# Fleet baseline (docs/BEST-CONFIG.md SS4): majors are NEVER ignored - each
# semver-major update arrives as its own PR. Under the zero-tolerance
# dependency gate, a fix that only ships in a new major has to be able to
# arrive. The previous blanket `ignore: version-update:semver-major` on
# every rail was a baseline-audit gap and is removed.
- package-ecosystem: pip
  directory: /backend
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    pip-backend-patch-minor:
      patterns:
      - '*'
      update-types:
      - patch
      - minor
  labels:
  - dependencies
  - type:chore
  - area:ci
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    npm-root-patch-minor:
      patterns:
      - '*'
      update-types:
      - patch
      - minor
  labels:
  - dependencies
  - type:chore
  - area:ci
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    github-actions-root-patch-minor:
      patterns:
      - '*'
      update-types:
      - patch
      - minor
  labels:
  - dependencies
  - type:chore
  - area:ci
