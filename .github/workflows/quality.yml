# Lean 6-gate quality caller (ADDITIVE — see the lean-gate charter, 2026-06-16).
#
# This thin caller delegates to the shared reusable lean-quality template. It does
# NOT replace the existing Quality Zero Platform workflows in this repo; those stay
# until the fleet-wide migration runbook removes the old SaaS machinery.
#
# Pinned to the template BRANCH (feat/lean-quality-template) on purpose so this
# PR's CI exercises the real template now. The runbook re-pins this to a tag once
# the template merges to the platform's default branch.
name: quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: Prekzursil/quality-zero-platform/.github/workflows/reusable-quality.yml@feat/lean-quality-template
    with:
      opengrep-paths: "backend frontend"
