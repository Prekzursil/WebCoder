name: Verify

# Full-stack verify (single-branch): backend check+pytest AND frontend lint+test+build
# from the repo root — see scripts/verify.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    env:
      SECRET_KEY: ci-placeholder
      DB_PASSWORD: ci-placeholder
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: bash scripts/verify
