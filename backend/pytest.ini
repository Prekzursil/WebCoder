[pytest]
# Tests run against the sqlite CI settings so the suite is self-contained and
# does not require a live PostgreSQL service (the lean quality gate provisions
# none). Production still uses webcoder_api.settings (PostgreSQL).
DJANGO_SETTINGS_MODULE = webcoder_api.settings_ci
python_files = tests.py test_*.py *_tests.py
addopts = --nomigrations --cov=. --cov-report=html
